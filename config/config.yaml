pipeline:
  name: "FrontierAtlas Intelligence Pipeline"
  environment: "development"
  log_level: "INFO"
  db_url: "sqlite:///data/frontier_atlas.db"

crawler:
  user_agent: "FrontierAtlas-Bot/1.0 (+https://github.com/frontieratlas)"
  timeout_seconds: 20
  max_retries: 4
  initial_backoff_seconds: 1.0
  max_backoff_seconds: 30.0
  backoff_factor: 2.0
  jitter: true
  max_concurrent_requests: 10

llm:
  default_provider: "gemini"
  fallback_chain:
    - "gemini"
    - "groq"
    - "deepseek"
  providers:
    gemini:
      model: "gemini-1.5-flash"
      max_tokens: 4096
      temperature: 0.1
      rate_limit_per_min: 15
    groq:
      model: "llama-3.1-70b-versatile"
      max_tokens: 4096
      temperature: 0.1
      rate_limit_per_min: 30
    deepseek:
      model: "deepseek-chat"
      max_tokens: 4096
      temperature: 0.1
      rate_limit_per_min: 60

entity_resolution:
  fuzzy_threshold: 85.0
  seed_entities:
    - "OpenAI"
    - "Anthropic"
    - "Google DeepMind"
    - "Meta AI"
    - "Microsoft AI"
    - "Mistral AI"
    - "Cohere"
    - "Scale AI"
